[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nves-au"
version = "0.1.0"
description = "Open-source toolkit for Australia's New Vehicle Efficiency Standard (NVES): fleet CO2 target, credit/debit and penalty-exposure calculator with a scenario simulator and Streamlit dashboard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Haiiiii" }]
keywords = ["nves", "automotive", "emissions", "compliance", "australia"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.37"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
nves-au = "nves_au.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nves_au"]

[tool.hatch.build.targets.wheel.force-include]
"config/regulation" = "nves_au/_config_data/regulation"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
