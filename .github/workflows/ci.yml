name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + app extras
        run: pip install -e ".[dev,app]"

      - name: Lint (ruff)
        run: ruff check nves_au tests

      - name: Test (pytest)
        run: pytest --cov=nves_au --cov-report=term-missing

      - name: Smoke test the CLI entry point
        run: nves-au demo
